[project]
name = "ai-ca2"
version = "0.1.0"
description = "RL agent trained on the BipedalWalker enviornment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "gymnasium[box2d]",
    "stable-baselines3[extra]",
    "sb3-contrib",
    "tensorboard",
    "pygame",
    "pyyaml",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
